<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>Painel de inscrições | HYDRA 7</title>
<link rel="stylesheet" href="style.css?v=hydra7-logo-20261124">
<link rel="stylesheet" href="f7-improvements.css?v=hydra7-logo-20261124">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>window.OneSignalDeferred=window.OneSignalDeferred||[];OneSignalDeferred.push(async function(OneSignal){await OneSignal.init({appId:"5718faa6-5e14-42f1-b98a-0c22758c4109"});});</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="admin-inscricoes.js?v=hydra7-logo-20261124" defer></script>
</head>
<body class="admin-page">
<header class="topbar">
<a class="brand" href="index.html"><img class="brand-logo" src="https://i.imgur.com/PpOaLAu.png" alt="HYDRA 7"><span>HYDRA <b>7</b></span></a>
<nav class="admin-shortcuts"><a class="back-link" href="admin.html">PAINEL DO SITE</a><a class="back-link" href="index.html">← VOLTAR AO SITE</a></nav>
</header>
<main class="admin-wrap">
<section id="loginPanel" class="admin-box">
<p class="eyebrow">ACESSO RESTRITO</p>
<h1 class="admin-title">INSCRIÇÕES <span>HYDRA 7</span></h1>
<p class="admin-subtitle">Entre com a conta de administrador cadastrada no Supabase.</p>
<form id="loginForm">
<label class="field"><span>E-MAIL</span><input id="email" type="email" autocomplete="username" required></label>
<label class="field"><span>SENHA</span><input id="password" type="password" autocomplete="current-password" required></label>
<button class="button button-red admin-submit" type="submit">ENTRAR NAS INSCRIÇÕES</button>
<p id="loginMessage" class="admin-message" role="status"></p>
</form>
</section>
<section id="dashboard" hidden>
<div class="admin-heading">
<div><p class="eyebrow">CENTRAL DE RECRUTAMENTO</p><h1 class="admin-title">ANÁLISE DE <span>INSCRIÇÕES</span></h1><p id="welcome" class="admin-subtitle"></p></div>
<button id="logoutButton" class="button button-outline">SAIR</button>
</div>
<div class="admin-toolbar"><div><h2>INSCRIÇÕES RECEBIDAS</h2><p>Confira os dados e defina o status de cada candidato.</p></div><div class="admin-toolbar-actions"><button id="enablePushButton" class="button button-outline" type="button">ATIVAR NOTIFICAÇÕES NESTE CELULAR</button><button id="refreshButton" class="button button-red">ATUALIZAR</button></div></div>
<div class="admin-filters">
<button class="admin-tab active" data-filter="Pendente">PENDENTES</button>
<button class="admin-tab" data-filter="AguardandoAdicao">FALTAM ADICIONAR</button>
<button class="admin-tab" data-filter="Aprovado">APROVADAS</button>
<button class="admin-tab" data-filter="Reprovado">REPROVADAS</button>
</div>
<div id="applications" class="admin-table-wrap"><p class="admin-loading">Carregando inscrições...</p></div>
<p id="dashboardMessage" class="admin-message" role="status"></p>
</section>
</main>
</body>
</html>
